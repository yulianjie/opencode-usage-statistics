[project]
name = "opencode-usage-statistics"
version = "0.1.0"
description = "FastAPI web app to analyze OpenCode token usage from opencode.db"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
opencode-usage-web = "run:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
